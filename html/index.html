<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airsoft Leaderboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <div class="hud-stack">
      <div id="killfeed" class="killfeed-container"></div>
      <div id="timer-display" class="timer-container" style="display: none">
        <div class="timer-content">
          <span id="timer-text">10:00</span>
        </div>
      </div>
      <div id="leaderboard" class="leaderboard-container" style="display: none">
        <div class="leaderboard-header">
          <h1 id="leaderboard-title">🎯 AIRSOFT ARENA</h1>
          <h2 id="leaderboard-subtitle">Leaderboard</h2>
        </div>
        <div class="leaderboard-content">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th id="col-player">Player</th>
                <th id="col-team">Team</th>
                <th>K</th>
                <th>D</th>
                <th>K/D</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body">
              <!-- Leaderboard entries will be dynamically added here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div
      id="final-scoreboard-overlay"
      class="final-scoreboard-overlay"
      style="display: none"
    >
      <div id="final-scoreboard" class="final-scoreboard-container">
        <div class="leaderboard-header final-scoreboard-header">
          <h1 id="final-scoreboard-title">🏁 FINAL SCOREBOARD</h1>
          <h2 id="final-scoreboard-subtitle">Match Results</h2>
        </div>
        <div class="leaderboard-content final-scoreboard-content">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th id="final-col-player">Player</th>
                <th id="final-col-team">Team</th>
                <th>K</th>
                <th>D</th>
                <th>K/D</th>
              </tr>
            </thead>
            <tbody id="final-leaderboard-body"></tbody>
          </table>
        </div>
        <div class="final-scoreboard-actions">
          <button
            id="final-scoreboard-close"
            type="button"
            class="final-scoreboard-close-button"
          >
            Close
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
